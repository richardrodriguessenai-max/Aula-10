                <!-- Calendário -->

                    class="w-full md:w-[140px] xl:w-full shrink-0 bg-[#000000] text-[#FFFFFF] border border-[#4A4A4A] rounded-md px-2 py-3 text-xs focus:outline-none focus:ring-2 focus:ring-[#FFFFFF]">

                <!-- Botão Adicionar -->
                <button type="submit" class="bg-[#FFFFFF] text-[#000000]
         hover:bg-[#E5E5E5]
         hover:ring-2 hover:ring-[#F5F5F5]
         transition-all duration-300 ease-in-out
         rounded-lg px-4 py-3">
                    Adicionar
                </button>

            </form>

            <!-- Pesquisa -->

                    class="px-4 py-3 rounded-full bg-[#FFFFFF] text-[#000000] font-semibold whitespace-nowrap shrink-0">

                    class="px-4 py-3 rounded-full bg-[#1F1F1F] text-[#FFFFFF] hover:bg-[#333333] whitespace-nowrap shrink-0 transition-colors">
                    Pendentes
